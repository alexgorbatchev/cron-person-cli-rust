[package]
name = "cron-person-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Authorize and schedule per-directory cron tasks"

[[bin]]
name = "cron-person"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
clap_complete = "4.6.11"
croner = "4.0.1"
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-quote = "0.8.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
